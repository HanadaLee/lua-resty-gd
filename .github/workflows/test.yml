name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: OpenResty tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates cpanminus git gnupg libgd-dev lsb-release wget

      - name: Install OpenResty
        shell: bash
        run: |
          set -euxo pipefail
          wget -O - https://openresty.org/package/pubkey.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/openresty.gpg] https://openresty.org/package/ubuntu $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/openresty.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openresty

      - name: Install Test::Nginx
        shell: bash
        run: |
          set -euxo pipefail
          sudo cpanm --notest Test::Nginx
          git clone --depth 1 https://github.com/openresty/test-nginx.git "$RUNNER_TEMP/test-nginx"

      - name: Validate OpenResty configuration
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$RUNNER_TEMP/openresty-prefix"
          mkdir -p "$prefix/logs"
          cat > "$RUNNER_TEMP/nginx.conf" <<'EOF'
          events {}
          http {}
          EOF
          openresty -t -p "$prefix/" -c "$RUNNER_TEMP/nginx.conf"

      - name: Run Test::Nginx suite
        env:
          TEST_NGINX_BINARY: openresty
        run: |
          set -euxo pipefail
          prove -I "$RUNNER_TEMP/test-nginx/lib" t
